[package]
name = "gungnir"
version = "0.1.0"
edition = "2024"
description = "Benchmark of coding agents across programming languages and reasoning effort"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eyre = "0.6.14"
globset = "0.4.21"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.8"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
