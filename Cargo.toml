[package]
name = "gungnir"
version = "0.1.0"
edition = "2024"
description = "Benchmark of coding agents across programming languages and reasoning effort"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
eyre = "0.6.14"
globset = "0.4.21"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
nix = { version = "0.31.3", features = ["signal"] }
tempfile = "3.27.0"
