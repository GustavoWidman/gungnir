# Claude Code cuts a response of a model it does not know at 32,000 output tokens, reasoning
# included, which GLM-5.3-Flash outgrows at high effort. Third-party listings give it an output
# limit of about 131K tokens, and Z.ai accepted max_tokens = 131072 for it on 2026-11-08.
[[models]]
id = "glm-5.3"
efforts = ["low", "high", "max"]
served-by = { zai = "glm-5.3" }
max-output-tokens = 131072
prices = [{ since = "2026-11-03", input = 1.4, output = 4.4, cache-read = 0.26 }]

[[models]]
id = "glm-5.3-flash"
efforts = ["low", "high", "max"]
served-by = { zai = "glm-5.3-flash" }
max-output-tokens = 131072
prices = [{ since = "2026-11-03", input = 0.15, output = 0.5, cache-read = 0.03 }]

# The endpoint takes every effort from none to xhigh, and max as xhigh, but only none (reasoning
# off) changed the model's behaviour in probes on 2026-11-06 (paper/notes/probes.md), so it
# offers none and one reasoning level. NVIDIA serves it free of charge.
[[models]]
id = "nemotron-3.5-super-vl"
efforts = ["none", "high"]
served-by = { nvidia = "nvidia/nemotron-3.5-super-vl-120b-a12b" }
prices = [{ since = "2026-11-06", input = 0.0, output = 0.0, cache-read = 0.0, cache-write = 0.0 }]

# `deepseek-flash` is served by DeepSeek-V4.1-Flash-1017. Its Responses API takes the efforts
# none (thinking off), low, high and max, and maps minimal to low and medium and xhigh to high.
# The prices are the off-peak ones; DeepSeek charges double on weekdays 01:00-04:00 and
# 06:00-10:00 UTC.
[[models]]
id = "deepseek-v4.1-flash"
efforts = ["none", "low", "high", "max"]
served-by = { deepseek = "deepseek-flash" }
prices = [{ since = "2026-11-06", input = 0.15, output = 0.6, cache-read = 0.003 }]

# Google's list price for the Gemini API's standard tier, read on its pricing page on
# 2026-11-06, which states these rates through 2026-12-31 and double rates from 2027-01-01.
# Google lists no price for writing the cache, only one for storing it by the hour. The proxy
# serves the model at one thinking level, high, under a name of its own.
[[models]]
id = "gemini-3.8-flash"
efforts = ["high"]
served-by = { cliproxy = "gemini-3.8-flash-high" }
prices = [
  { since = "2026-11-06", input = 0.75, output = 3.75, cache-read = 0.075 },
  { since = "2027-01-01", input = 1.5, output = 7.5, cache-read = 0.15 },
]

# LM Studio serves the model's 8-bit quantization (q8_0) on local hardware, so its tokens cost
# nothing. Its two efforts are reasoning off and on: LM Studio's Responses API reasons for none
# not at all and for low or high alike (1,013 and 1,135 reasoning tokens on one prompt, 2026-11-06).
[[models]]
id = "ornith-1.5-35b-a3b"
efforts = ["none", "high"]
served-by = { lmstudio = "ornith-1.5-35b-a3b@q8_0" }
prices = [{ since = "2026-11-06", input = 0.0, output = 0.0, cache-read = 0.0, cache-write = 0.0 }]
