# The catalog: sandbox base, measurement and profiling tools, harness packages, backends and
# models. Adding a model is one [[models]] entry. Adding a backend for an existing harness is one
# [backends.<id>] table. Prices are USD per million tokens from the vendor's pricing page,
# read on the date of each model's first tier (paper/notes/facts-models-tooling.md has the
# 2026-11-03 readings); `since` is the date a tier applies from. A rate the vendor page does not
# list is omitted, never guessed.

[sandbox]
packages = ["bashInteractive", "coreutils", "diffutils", "findutils", "gawk", "gnugrep", "gnused", "which", "socat", "cacert"]

# Bound beside a language only in the sandboxes that time programs. GNU time reads the peak
# resident memory of each program's output check.
[measure]
packages = ["hyperfine", "time"]

# Bound beside a language only in the sandboxes of `gungnir profile`, apart from [measure] so
# that a new perf never makes a measurement stale.
[profile]
packages = ["perf", "inferno"]

[harnesses.claude-code]
package = "claude-code"

[harnesses.codex]
package = "codex"

[backends.anthropic]
harness = "claude-code"
credential = { kind = "env-token", var = "CLAUDE_CODE_OAUTH_TOKEN", file = "~/.config/gungnir/claude/oauth_token" }
egress = ["api.anthropic.com"]

[backends.openai]
harness = "codex"
credential = { kind = "codex-home", dir = "~/.config/gungnir/codex" }
egress = ["chatgpt.com", "auth.openai.com", "api.openai.com"]

[backends.zai]
harness = "claude-code"
endpoint = "https://api.z.ai/api/anthropic"
credential = { kind = "api-key", var = "ANTHROPIC_AUTH_TOKEN", file = "~/.config/gungnir/glm/api_key" }
egress = ["api.z.ai"]
# Claude Code reports no quota for Z.ai, so gungnir reads the plan's own meter between attempts.
quota = { kind = "zai-monitor", url = "https://api.z.ai/api/monitor/usage/quota/limit" }

# NVIDIA's hosted API through Codex, which speaks the endpoint's Responses API. NVIDIA reports no
# quota anywhere: no rate-limit headers, and a busy endpoint queues requests. Its free tier
# refuses bursts of requests with a 429 that names no retry-after, on which Codex ends the
# session at once, so the agent's requests go through gungnir's relay, which holds the key and
# tries a refused request again.
[backends.nvidia]
harness = "codex"
endpoint = "https://integrate.api.nvidia.com/v1"
credential = { kind = "api-key", var = "NVIDIA_API_KEY", file = "~/.config/gungnir/nvidia/api_key" }
egress = ["integrate.api.nvidia.com"]
relay = true

# DeepSeek's own API through Codex, which speaks its Responses API. The key stays with the relay,
# which also retries a refusal before it reaches the agent.
[backends.deepseek]
harness = "codex"
endpoint = "https://api.deepseek.com/v1"
credential = { kind = "api-key", var = "DEEPSEEK_API_KEY", file = "~/.config/gungnir/deepseek/api_key" }
egress = ["api.deepseek.com"]
relay = true

# Gemini through a CLIProxyAPI instance, which serves the Responses API in front of Google's
# models on port 8317 of a tailnet host, under a certificate a public CA signed. The egress
# tunnel reaches only port 443, so the agent's requests go through gungnir's relay, which also
# holds the key and tries a refused request again.
[backends.cliproxy]
harness = "codex"
endpoint = "https://lab.tail4a3ea.ts.net:8317/v1"
credential = { kind = "api-key", var = "CLIPROXY_API_KEY", file = "~/.config/gungnir/cliproxy/api_key" }
egress = ["lab.tail4a3ea.ts.net"]
relay = true

# LM Studio on a machine of the local network, which serves the Responses API over plain HTTP
# on port 1234 and checks no key. The egress tunnel carries only TLS to port 443, so the agent's
# requests go through gungnir's relay. The key file holds a placeholder, because a backend that
# relays has an api-key credential.
[backends.lmstudio]
harness = "codex"
endpoint = "http://192.168.101.190:1234/v1"
credential = { kind = "api-key", var = "LMSTUDIO_API_KEY", file = "~/.config/gungnir/lmstudio/api_key" }
egress = ["192.168.101.190"]
relay = true

# Every Claude model gets Claude Code's highest output ceiling, which Claude Code clamps to each
# model's own maximum, so a long response is never cut and resumed at the 32,000 default.
[[models]]
id = "claude-fable-5-1"
efforts = ["low", "medium", "high", "xhigh", "max"]
served-by = { anthropic = "claude-fable-5-1" }
max-output-tokens = 128000
prices = [{ since = "2026-11-03", input = 10.0, output = 50.0, cache-read = 0.25, cache-write = 12.5, cache-write-1h = 20.0 }]

[[models]]
id = "claude-opus-5-5"
efforts = ["low", "medium", "high", "xhigh", "max"]
served-by = { anthropic = "claude-opus-5-5" }
max-output-tokens = 128000
prices = [{ since = "2026-11-03", input = 4.0, output = 20.0, cache-read = 0.2, cache-write = 5.0, cache-write-1h = 8.0 }]

[[models]]
id = "claude-sonnet-5-5"
efforts = ["low", "medium", "high", "xhigh", "max"]
served-by = { anthropic = "claude-sonnet-5-5" }
max-output-tokens = 128000
prices = [{ since = "2026-11-03", input = 2.0, output = 10.0, cache-read = 0.1, cache-write = 2.5, cache-write-1h = 4.0 }]

[[models]]
id = "claude-haiku-5-5"
efforts = ["low", "medium", "high", "xhigh", "max"]
served-by = { anthropic = "claude-haiku-5-5" }
