# The catalog: sandbox base, measurement tools, harness packages, backends and models.
# Adding a model is one [[models]] entry. Adding a backend for an existing harness is one
# [backends.<id>] table. Prices are USD per million tokens, checked on the vendor pages on
# 2026-11-03 (paper/notes/facts-models-tooling.md). A rate the vendor page does not list is
# omitted, never guessed.

[sandbox]
packages = ["bashInteractive", "coreutils", "diffutils", "findutils", "gawk", "gnugrep", "gnused", "which", "socat", "cacert"]

# Bound beside a language only in the sandboxes that time programs. GNU time reads the peak
# resident memory of each program's output check.
[measure]
packages = ["hyperfine", "time"]

[harnesses.claude-code]
package = "claude-code"

[harnesses.codex]
package = "codex"

[backends.anthropic]
harness = "claude-code"
credential = { kind = "env-token", var = "CLAUDE_CODE_OAUTH_TOKEN", file = "~/.config/gungnir/claude/oauth_token" }
egress = ["api.anthropic.com"]

[backends.openai]
harness = "codex"
credential = { kind = "codex-home", dir = "~/.config/gungnir/codex" }
egress = ["chatgpt.com", "auth.openai.com", "api.openai.com"]

[backends.zai]
harness = "claude-code"
endpoint = "https://api.z.ai/api/anthropic"
credential = { kind = "api-key", var = "ANTHROPIC_AUTH_TOKEN", file = "~/.config/gungnir/glm/api_key" }
egress = ["api.z.ai"]

[[models]]
id = "claude-fable-5-1"
efforts = ["low", "medium", "high", "xhigh", "max"]
served-by = { anthropic = "claude-fable-5-1" }
prices = [{ since = "2026-11-03", input = 10.0, output = 50.0, cache-read = 0.25, cache-write = 12.5, cache-write-1h = 20.0 }]

