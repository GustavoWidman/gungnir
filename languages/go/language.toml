packages = ["go_1_27"]
build = [["go", "build", "-o", "solution", "."]]
run = ["./solution"]
version = ["sh", "-c", 'go env GOVERSION | sed -nE "s/^go([0-9]+[.][0-9]+).*/\1/p"']
sources = ["**/*.go"]
ignore = ["solution"]
lizard = "go"

[env]
CGO_ENABLED = "0"
GOCACHE = "/tmp/go-cache"
GOPATH = "/tmp/go-path"
GOPROXY = "off"
GOTOOLCHAIN = "local"

# How `gungnir profile` samples a program. Go keeps frame pointers on amd64, so the cheap frame
# pointer walk recovers whole stacks.
[profile]
call-graph = "fp"
shows = "Go functions with their full call stacks, named by package, such as main.main and runtime.mapassign_faststr, the runtime's map, allocator and garbage collector code among them, with the collector's workers as stacks of their own. Inlined functions fold into the function they were inlined into, and a caller can carry the name of a function inlined at its call, such as internal/runtime/atomic.(*Uint32).Load between runtime.main and main.main."
