packages = ["go_1_27"]
build = [["go", "build", "-o", "solution", "."]]
run = ["./solution"]
version = ["sh", "-c", 'go env GOVERSION | sed -nE "s/^go([0-9]+[.][0-9]+).*/\1/p"']
sources = ["**/*.go"]
ignore = ["solution"]
lizard = "go"

[env]
CGO_ENABLED = "0"
GOCACHE = "/tmp/go-cache"
GOPATH = "/tmp/go-path"
GOPROXY = "off"
GOTOOLCHAIN = "local"
