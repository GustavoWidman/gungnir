packages = ["llvmPackages_23.clang"]
build = [["find", "src", "-name", "*.cpp", "-exec", "clang++", "-std=gnu++23", "-O3", "-DNDEBUG", "-Wall", "-Wextra", "-o", "solution", "{}", "+"]]
run = ["./solution"]
version = ["sh", "-c", 'set -eu; clang=$(clang++ --version | sed -nE "s/^clang version ([0-9]+)[.].*/\1/p"); libstdcxx=$(echo "#include <bits/c++config.h>" | clang++ -x c++ -std=gnu++23 -E -dM - | sed -nE "s/^#define _GLIBCXX_RELEASE ([0-9]+)/\1/p"); test -n "$clang"; test -n "$libstdcxx"; echo "Clang $clang and libstdc++ $libstdcxx"']
sources = ["src/**/*.cpp", "src/**/*.hpp", "src/**/*.h"]
ignore = ["solution"]
lizard = "cpp"

# How `gungnir profile` samples a program. Clang omits frame pointers at -O3, so a frame pointer
# walk stops at the sampled function; DWARF unwinding recovers the whole stack.
[profile]
call-graph = "dwarf"
shows = "Native functions with their full call stacks, the C library's among them. Inlined functions fold into the function they were inlined into, and a stack deeper than the 8 KiB perf copies per sample is cut short."
