packages = ["rust-nightly", "gcc"]
build = [["cargo", "build", "--release", "--offline", "--quiet"]]
run = ["./target/release/solution"]
version = ["sh", "-c", 'rustc --version | sed -nE "s/^rustc ([0-9]+[.][0-9]+)[.][0-9]+([^ ]*) .*/\1\2/p"']
sources = ["src/**/*.rs"]
ignore = ["target/**"]
lizard = "rust"

[env]
CARGO_HOME = "/tmp/cargo-home"

# How `gungnir profile` samples a program. Release builds omit frame pointers, so a frame
# pointer walk stops at the sampled function; DWARF unwinding recovers the whole stack.
[profile]
call-graph = "dwarf"
shows = "Native functions with their full call stacks, the standard library's generic code named by its instantiation, such as HashMap::rustc_entry. Inlined functions fold into the function they were inlined into, and a stack deeper than the 8 KiB perf copies per sample is cut short."
