packages = ["rust-nightly", "gcc"]
build = [["cargo", "build", "--release", "--offline", "--quiet"]]
run = ["./target/release/solution"]
version = ["sh", "-c", 'rustc --version | sed -nE "s/^rustc ([0-9]+[.][0-9]+)[.][0-9]+([^ ]*) .*/\1\2/p"']
sources = ["src/**/*.rs"]
ignore = ["target/**"]
lizard = "rust"

[env]
CARGO_HOME = "/tmp/cargo-home"

# How `gungnir profile` samples a program. Release builds omit frame pointers, and perf's DWARF
# unwinding loses the caller of almost every sample in a binary this nightly links with rust-lld,
# so the profile's own builds keep frame pointers for the cheap frame pointer walk.
[profile]
call-graph = "fp"
build-env = { RUSTFLAGS = "-Cforce-frame-pointers=yes" }
shows = "Native functions with their full call stacks, the standard library's generic code named by its instantiation, such as HashMap::rustc_entry. The profiled build keeps frame pointers, which the measured build omits, so it can run slightly slower. Inlined functions fold into the function they were inlined into."
