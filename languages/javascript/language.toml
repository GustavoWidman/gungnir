packages = ["bun"]
# Bun's bundler parses every module the entry imports, with the parser that runs the program,
# and fails on a syntax error or an import that does not resolve. Nothing is executed and
# nothing is written to the workspace.
build = [["bun", "build", "main.js", "--target=bun", "--outfile=/dev/null"]]
run = ["bun", "main.js"]
version = ["sh", "-c", 'bun --version | sed -nE "s/^([0-9]+[.][0-9]+)[.].*/\1/p"']
sources = ["**/*.js", "**/*.mjs", "**/*.cjs"]
ignore = ["node_modules/**"]
lizard = "javascript"

# The transpiler cache is off so no run reuses another's work, and auto-install is off because
# the sandbox has no registry.
[env]
BUN_INSTALL_CACHE_DIR = "/tmp/bun-install-cache"
BUN_OPTIONS = "--no-install"
BUN_RUNTIME_TRANSPILER_CACHE_PATH = "0"
DO_NOT_TRACK = "1"

# How `gungnir profile` samples a program. JavaScriptCore keeps frame pointers, so the walk
# recovers whole stacks, but it names its compiled code only in a JITDump whose file name this perf
# does not recognise, and the packaged Bun is stripped, so neither has names.
[profile]
call-graph = "fp"
shows = "How a run's time splits between compiled JavaScript, as [perf-<pid>.map] frames, Bun's and JavaScriptCore's native code, as [bun] frames, and the C library's functions, which are named, with the garbage collector and JIT compiler threads (HeapHelper, JITWorker) as stacks of their own. It cannot name a JavaScript function or a function of Bun's runtime."
